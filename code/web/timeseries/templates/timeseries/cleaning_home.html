<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cleaning: {{ dataset }}</title>
  </head>
  <body>
    <h2>Cleaning: {{ dataset }}</h2>

    <form method="get">
      <label for="mjd">Dostępne MJD:</label>

      <select id="mjd" name="mjd">
        {% for opt in mjd_options %}
          <option value="{{ opt.value }}" {% if opt.value == selected_mjd %}selected{% endif %}>
            {{ opt.label }}
          </option>
        {% empty %}
          <option disabled>(brak folderów MJD)</option>
        {% endfor %}
      </select>

      <button type="submit">Wybierz</button>
    </form>

    {% if selected_mjd %}
      <hr />
      <p>Wybrany MJD: <b>{{ selected_mjd }}</b></p>
    {% endif %}
  </body>
</html>
