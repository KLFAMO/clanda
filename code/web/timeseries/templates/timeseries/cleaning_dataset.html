<!doctype html>
<html>
  <head>
    {% load static %}
    <meta charset="utf-8" />
    <title>Cleaning: {{ dataset }}</title>
  </head>
  <body>
    <h2>Cleaning: {{ dataset }}</h2>

    <form id="dataForm" method="get">
      <input type="hidden" name="dataset" value="{{ dataset }}">
      <label for="mjd">Available MJD:</label>

      <select id="mjd" name="mjd">
        {% for opt in mjd_options %}
          <option value="{{ opt.value }}" {% if opt.value == selected_mjd %}selected{% endif %}>
            {{ opt.label }}
          </option>
        {% empty %}
          <option disabled>(brak plików .npz w tym dataset)</option>
        {% endfor %}
      </select>

      <button type="button" id="btnPlot">Select</button>
    </form>

    {% if selected_mjd %}
      <hr />
      <p>Wybrany zakres: <b>{{ selected_mjd }}</b></p>
    {% endif %}

    <div id="status" style="margin: 10px 0; color: #666;"></div>

    <div id="plotWrap" style="width: 100%; height: 450px; border:1px solid #ddd;">
      <canvas id="plot" style="display:block; width:100%; height:100%;"></canvas>
    </div>

    <script type="module" src="{% static 'js/cleaning_plot.js' %}"></script>
  </body>
</html>
